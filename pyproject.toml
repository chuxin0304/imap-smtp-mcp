[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "imap-smtp-mcp"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server for IMAP and SMTP email management."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp",
    "beautifulsoup4>=4.12.0",
]

[project.scripts]
imap-smtp-mcp = "server:mcp.run"
